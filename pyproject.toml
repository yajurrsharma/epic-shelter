[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-shelter"
version = "1.0.0"
description = "A lightweight, content-addressed deduplication backup CLI engine"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Yajur Sharma" }
]
license = { text = "MIT" }
dependencies = [
    "xxhash>=3.0.0",
    "zstandard>=0.20.0",
]

[project.scripts]
shelter = "epic_shelter.cli:main"

[tool.setuptools.packages.find]
where = ["."]